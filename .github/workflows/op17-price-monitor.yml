name: OP17 Price Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: op17-price-monitor
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r op17-price-monitor/requirements.txt

      - name: Check prices
        working-directory: op17-price-monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "op17-price-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add op17-price-monitor/state.json
          git diff --cached --quiet || git commit -m "Update OP17 price state [skip ci]"
          git push
